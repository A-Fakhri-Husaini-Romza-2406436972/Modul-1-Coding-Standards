<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h3>Pay Order</h3>

    <div th:if="${order != null}">
        <p><strong>Order ID:</strong> <span id="orderIdText" th:text="${order.id}"></span></p>
        <p><strong>Author:</strong> <span th:text="${order.author}"></span></p>
        <p><strong>Status:</strong> <span th:text="${order.status}"></span></p>

        <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
            <div class="form-group">
                <label for="methodInput">Method</label>
                <select id="methodInput" name="method" class="form-control col-6">
                    <option value="VOUCHER_CODE">VOUCHER_CODE</option>
                    <option value="BANK_TRANSFER">BANK_TRANSFER</option>
                </select>
            </div>
            <div class="form-group">
                <label for="voucherCodeInput">Voucher Code</label>
                <input id="voucherCodeInput" name="voucherCode" type="text" class="form-control col-6" placeholder="Voucher code">
            </div>
            <div class="form-group">
                <label for="bankNameInput">Bank Name</label>
                <input id="bankNameInput" name="bankName" type="text" class="form-control col-6" placeholder="Bank name">
            </div>
            <div class="form-group">
                <label for="referenceCodeInput">Reference Code</label>
                <input id="referenceCodeInput" name="referenceCode" type="text" class="form-control col-6" placeholder="Reference code">
            </div>
            <button type="submit" class="btn btn-primary">Submit Payment</button>
        </form>
    </div>
    <div th:if="${order == null}">
        <p>Order not found.</p>
    </div>
</div>
</body>
</html>
